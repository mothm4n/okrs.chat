{{ define "main" }}
  <article class="post" aria-labelledby="post-title">
    <p class="section-kicker">Journal</p>
    <h1 id="post-title">{{ .Title }}</h1>
    <p class="post-meta">Published <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time> · By <a href="{{ .Site.Params.authorLinkedIn }}" target="_blank" rel="noreferrer">Marc Gelpi, OKR expert</a></p>
    <div class="post-content">{{ .Content }}</div>
  </article>
{{ end }}
